<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Uśmiechnięty jednorożec puszcza oko">
  <title>Uśmiechnięty jednorożec puszcza oko</title>
  <defs>
    <linearGradient id="uni-horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f9c74f"/>
      <stop offset="1" stop-color="#ffe8a3"/>
    </linearGradient>
    <style>
      /* nazwy z prefiksem uni-, bo przy wstawieniu inline style trafiają do całej strony */
      .uni-wink-open  { transform-box: fill-box; transform-origin: center; animation: uni-wink 12s ease-in-out infinite; }
      .uni-wink-close { opacity: 0; animation: uni-wink-arc 12s ease-in-out infinite; }
      .uni-smile      { transform-box: fill-box; transform-origin: center top; animation: uni-smile 12s ease-in-out infinite; }
      .uni-sparkle    { transform-box: fill-box; transform-origin: center; animation: uni-twinkle 2s ease-in-out infinite; }
      .uni-sparkle.uni-s2 { animation-delay: 1s; }
      /* .no-wink na elemencie nadrzędnym (wstawka inline): bez mrugnięcia i bez szerszego uśmiechu */
      .no-wink .uni-wink-open, .no-wink .uni-wink-close, .no-wink .uni-smile { animation: none; }

      /* mrugnięcie raz na 12 s, ok. 2 s po starcie */
      @keyframes uni-wink {
        0%, 14%, 20.7%, 100% { transform: scaleY(1); opacity: 1; }
        15.7%, 19%           { transform: scaleY(0.1); opacity: 0; }
      }
      @keyframes uni-wink-arc {
        0%, 14.7%, 20%, 100% { opacity: 0; }
        15.7%, 19%           { opacity: 1; }
      }
      @keyframes uni-smile {
        0%, 12.7%, 22%, 100% { transform: scale(1, 1); }
        15.7%, 19%           { transform: scale(1.18, 1.25); }
      }
      @keyframes uni-twinkle {
        0%, 100% { transform: scale(0.4) rotate(0deg); opacity: 0.2; }
        50%      { transform: scale(1) rotate(45deg); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .uni-wink-open, .uni-wink-close, .uni-smile, .uni-sparkle { animation: none; }
      }
    </style>
  </defs>

  <g stroke="#5b3a55" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- grzywa z tyłu -->
    <!-- pastelowa tęcza, zgodnie z ruchem wskazówek zegara od lewego dołu -->
    <circle cx="26" cy="71" r="8"  fill="#ffadad"/>
    <circle cx="22" cy="57" r="9"  fill="#ffd6a5"/>
    <circle cx="27" cy="42" r="10" fill="#fdffb6"/>
    <circle cx="73" cy="42" r="10" fill="#a0c4ff"/>
    <circle cx="78" cy="57" r="9"  fill="#bdb2ff"/>
    <circle cx="74" cy="71" r="8"  fill="#d9c2ff"/>

    <!-- uszy -->
    <path d="M28 40 L30 17 L43 32 Z" fill="#fff"/>
    <path d="M72 40 L70 17 L57 32 Z" fill="#fff"/>
    <path d="M31.5 35 L32 24 L38.5 31.5 Z" fill="#fbcfe8" stroke="none"/>
    <path d="M68.5 35 L68 24 L61.5 31.5 Z" fill="#fbcfe8" stroke="none"/>

    <!-- głowa -->
    <ellipse cx="50" cy="56" rx="28" ry="26" fill="#fff"/>

    <!-- grzywka -->
    <circle cx="41" cy="32" r="7.5" fill="#caffbf"/>
    <circle cx="59" cy="32" r="7.5" fill="#9bf6ff"/>

    <!-- róg -->
    <path d="M44.5 33 L55.5 33 L50 4 Z" fill="url(#uni-horn)"/>
    <path d="M46.6 27 L53.6 24.5 M47.7 20 L52.6 18 M48.8 13 L51.4 12" fill="none" stroke="#e0a526" stroke-width="1.3"/>

    <!-- pyszczek -->
    <ellipse cx="50" cy="69" rx="16" ry="10.5" fill="#ffe4ef"/>
    <ellipse cx="44.5" cy="66" rx="1.3" ry="1.8" fill="#5b3a55" stroke="none"/>
    <ellipse cx="55.5" cy="66" rx="1.3" ry="1.8" fill="#5b3a55" stroke="none"/>

    <!-- uśmiech -->
    <path class="uni-smile" d="M43 71.5 Q50 77.5 57 71.5" fill="none" stroke-width="1.8"/>
  </g>

  <!-- lewe oko (otwarte, serduszko) -->
  <g transform="translate(38 51)">
    <path d="M0 4 C-5.5 0.2 -5.6 -5 -2.6 -5 C-1.1 -5 0 -4 0 -2.7 C0 -4 1.1 -5 2.6 -5 C5.6 -5 5.5 0.2 0 4 Z" fill="#3b2438"/>
    <circle cx="-2.4" cy="-2.9" r="1.1" fill="#fff"/>
  </g>

  <!-- prawe oko (serduszko, mruga) -->
  <g class="uni-wink-open">
    <g transform="translate(62 51)">
      <path d="M0 4 C-5.5 0.2 -5.6 -5 -2.6 -5 C-1.1 -5 0 -4 0 -2.7 C0 -4 1.1 -5 2.6 -5 C5.6 -5 5.5 0.2 0 4 Z" fill="#3b2438"/>
      <circle cx="-2.4" cy="-2.9" r="1.1" fill="#fff"/>
    </g>
  </g>
  <path class="uni-wink-close" d="M57.5 51.5 Q62 55 66.5 51.5" fill="none" stroke="#3b2438" stroke-width="2" stroke-linecap="round"/>

  <!-- iskierki -->
  <path class="uni-sparkle" d="M70 10 L71.4 14.6 L76 16 L71.4 17.4 L70 22 L68.6 17.4 L64 16 L68.6 14.6 Z" fill="#fde68a" stroke="#e0a526" stroke-width="0.8" stroke-linejoin="round"/>
  <path class="uni-sparkle uni-s2" d="M28 8 L29 11 L32 12 L29 13 L28 16 L27 13 L24 12 L27 11 Z" fill="#fbcfe8" stroke="#f472b6" stroke-width="0.8" stroke-linejoin="round"/>
</svg>
